name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sin verde no se mergea (§3).
#
# Cada job se ejecuta solo si el cambio le afecta. Un job omitido cuenta como
# aprobado: por eso la protección de rama debe exigir «CI completo» y NINGÚN
# otro check. Si se marcan los jobs individuales como obligatorios, un PR que
# no toca EvePay se queda esperando para siempre a un job que nunca va a correr.
jobs:
  # ── Qué áreas toca este cambio ─────────────────────────────────────────────
  cambios:
    name: Qué cambió
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.areas.outputs.shared }}
      api: ${{ steps.areas.outputs.api }}
      eveconecta: ${{ steps.areas.outputs.eveconecta }}
      landings: ${{ steps.areas.outputs.landings }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: sin ella no hay contra qué comparar.
          fetch-depth: 0

      - id: areas
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-areas.sh

  # ── Landings: una sola fuente de lo compartido ─────────────────────────────
  # Las landings son estáticas y cada una lleva su copia de base.css y de
  # formularios.js, generadas desde packages/brand/landing/. Este job impide
  # que se desvíen.
  landings:
    name: Archivos compartidos de las landings
    runs-on: ubuntu-latest
    needs: cambios
    if: ${{ needs.cambios.outputs.landings == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # Sin dependencias a propósito: el script usa solo node:fs y node:path,
      # así que no hace falta instalar el workspace para comprobarlo.
      - name: Copias al día
        run: node scripts/landings-sync.mjs --check

  # ── Paso 1: shared (bloquea todo lo demás) ─────────────────────────────────
  shared:
    name: Shared package
    runs-on: ubuntu-latest
    needs: cambios
    if: ${{ needs.cambios.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @evetev/shared lint

      - name: Typecheck
        run: pnpm --filter @evetev/shared typecheck

      - name: Build
        run: pnpm --filter @evetev/shared build

  # ── Paso 2a: EvePay API (depende de shared) ────────────────────────────────
  # `!failure() && !cancelled()` en vez del `success()` implícito: shared puede
  # quedar OMITIDO cuando el cambio no lo toca, y un `needs` omitido arrastraría
  # a este job. Lo que sí debe frenarlo es que shared falle.
  api:
    name: EvePay API
    runs-on: ubuntu-latest
    needs: [cambios, shared]
    if: ${{ !failure() && !cancelled() && needs.cambios.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @evetev/shared build

      - name: Lint
        run: pnpm --filter @evetev/api lint

      - name: Typecheck
        run: pnpm --filter @evetev/api typecheck

      - name: Test
        run: pnpm --filter @evetev/api test

      - name: Build
        run: pnpm --filter @evetev/api build

  # ── Paso 2b: EveConecta (depende de shared, corre en paralelo con api) ─────
  eveconecta:
    name: EveConecta
    runs-on: ubuntu-latest
    needs: [cambios, shared]
    if: ${{ !failure() && !cancelled() && needs.cambios.outputs.eveconecta == 'true' }}
    env:
      # NEXT_PUBLIC_* se hornean en el bundle en build time; valores de CI son
      # placeholders válidos (no tocan la red en build).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @evetev/shared build

      - name: Lint
        run: pnpm --filter @evetev/eveconecta lint

      - name: Typecheck
        run: pnpm --filter @evetev/eveconecta typecheck

      - name: Test
        run: pnpm --filter @evetev/eveconecta test

      - name: Build
        run: pnpm --filter @evetev/eveconecta build

  # ── El único check que debe exigir la protección de rama ───────────────────
  # Corre siempre, y solo se pone en rojo si algo falló o se canceló. Un job
  # omitido no es un fallo: es que ese área no se tocó.
  resultado:
    name: CI completo
    runs-on: ubuntu-latest
    if: always()
    needs: [cambios, landings, shared, api, eveconecta]
    steps:
      - name: Comprobar los resultados
        run: |
          resultados="${{ join(needs.*.result, ' ') }}"
          echo "Resultados: $resultados"
          for r in $resultados; do
            case "$r" in
              failure|cancelled)
                echo "::error::Hay jobs en rojo o cancelados."
                exit 1
                ;;
            esac
          done
          echo "Todo en verde (o correctamente omitido)."
