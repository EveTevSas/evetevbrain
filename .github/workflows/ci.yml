name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sin verde no se mergea (§3).
#
# Cada job se ejecuta solo si el cambio le afecta. Un job omitido cuenta como
# aprobado: por eso la protección de rama debe exigir «CI completo» y NINGÚN
# otro check. Si se marcan los jobs individuales como obligatorios, un PR que
# no toca EvePay se queda esperando para siempre a un job que nunca va a correr.
jobs:
  # ── Qué áreas toca este cambio ─────────────────────────────────────────────
  cambios:
    name: Qué cambió
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.areas.outputs.shared }}
      api: ${{ steps.areas.outputs.api }}
      eveconecta: ${{ steps.areas.outputs.eveconecta }}
      eveledger: ${{ steps.areas.outputs.eveledger }}
      evepayadmin: ${{ steps.areas.outputs.evepayadmin }}
      evestudio: ${{ steps.areas.outputs.evestudio }}
      landings: ${{ steps.areas.outputs.landings }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: sin ella no hay contra qué comparar.
          fetch-depth: 0

      - id: areas
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-areas.sh

  # ── Formato: una sola forma de escribir, en todo el repo ───────────────────
  # No lleva `if` de área a propósito. El formato es del repositorio entero, no
  # de una app: un cambio en docs/ puede desalinear igual que uno en apps/, y
  # gatearlo por área es justo cómo se acumuló la deriva que motivó este job —78
  # archivos, hasta el punto de que reformatear una landing convertía un cambio
  # de cuatro reglas en 1.693 líneas de diff y enterraba lo que de verdad
  # cambiaba.
  #
  # Que sea rápido importa: sin `if`, corre en cada PR. Por eso instala solo la
  # raíz (--filter . ) en vez del workspace entero, que es donde está el tiempo.
  formato:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Instalar solo la raíz
        run: pnpm install --frozen-lockfile --filter .

      # Prettier también valida la sintaxis al parsear. La primera vez que se
      # corrió sobre todo el repo encontró una llave suelta en el CSS de
      # eve-intelligence que llevaba ahí desde que se creó la landing: los
      # navegadores se la tragaban en silencio y nadie la había visto.
      - name: Formato al día
        run: pnpm format:check

  # ── Landings: una sola fuente de lo compartido ─────────────────────────────
  # Dos juegos de copias salen de packages/brand y este job impide que se
  # desvíen: base.css y formularios.js en apps/website/landings/, y los activos
  # de marca en la carpeta /marca de cada app. Los segundos existen desde que se
  # borró el repositorio de marca y cada app pasó a servirlos por su cuenta; un
  # activo que se desvía o que falta es una imagen rota, y una imagen rota no
  # hace fallar ningún despliegue.
  landings:
    name: Copias generadas desde packages/brand
    runs-on: ubuntu-latest
    needs: cambios
    if: ${{ needs.cambios.outputs.landings == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      # Sin dependencias a propósito: el script usa solo node:fs y node:path,
      # así que no hace falta instalar el workspace para comprobarlo.
      - name: Copias al día
        run: |
          node scripts/landings-sync.mjs --check
          node scripts/marca-sync.mjs --check

  # ── Paso 1: shared (bloquea todo lo demás) ─────────────────────────────────
  shared:
    name: Shared package
    runs-on: ubuntu-latest
    needs: cambios
    if: ${{ needs.cambios.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @evetev/shared lint

      - name: Typecheck
        run: pnpm --filter @evetev/shared typecheck

      - name: Build
        run: pnpm --filter @evetev/shared build

  # ── Paso 2a: EvePay API (depende de shared) ────────────────────────────────
  # `!failure() && !cancelled()` en vez del `success()` implícito: shared puede
  # quedar OMITIDO cuando el cambio no lo toca, y un `needs` omitido arrastraría
  # a este job. Lo que sí debe frenarlo es que shared falle.
  api:
    name: EvePay API
    runs-on: ubuntu-latest
    needs: [cambios, shared]
    if: ${{ !failure() && !cancelled() && needs.cambios.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @evetev/shared build

      - name: Lint
        run: pnpm --filter @evetev/api lint

      - name: Typecheck
        run: pnpm --filter @evetev/api typecheck

      - name: Test
        run: pnpm --filter @evetev/api test

      - name: Build
        run: pnpm --filter @evetev/api build

  # ── Paso 2b: EveConecta (depende de shared, corre en paralelo con api) ─────
  eveconecta:
    name: EveConecta
    runs-on: ubuntu-latest
    needs: [cambios, shared]
    if: ${{ !failure() && !cancelled() && needs.cambios.outputs.eveconecta == 'true' }}
    env:
      # NEXT_PUBLIC_* se hornean en el bundle en build time; valores de CI son
      # placeholders válidos (no tocan la red en build).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @evetev/shared build

      - name: Lint
        run: pnpm --filter @evetev/eveconecta lint

      - name: Typecheck
        run: pnpm --filter @evetev/eveconecta typecheck

      - name: Test
        run: pnpm --filter @evetev/eveconecta test

      - name: Build
        run: pnpm --filter @evetev/eveconecta build

  # ── EveLedger (independiente: no consume shared) ───────────────────────────
  # Sin DATABASE_URL a propósito. `prisma generate` solo lee el schema y todas
  # las rutas son `force-dynamic`, así que ni el typecheck ni el build tocan la
  # base. Si algún día una página se prerenderiza contra Postgres, este job es
  # el que lo va a delatar.
  eveledger:
    name: EveLedger
    runs-on: ubuntu-latest
    needs: cambios
    if: ${{ needs.cambios.outputs.eveledger == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @evetev/eveledger lint

      - name: Typecheck
        run: pnpm --filter @evetev/eveledger typecheck

      - name: Test
        run: pnpm --filter @evetev/eveledger test

      - name: Build
        run: pnpm --filter @evetev/eveledger build

  # ── Consola de EvePay ──────────────────────────────────────────────────────
  # Habla con la API por HTTP, pero consume packages/shared para las reglas que
  # deben ser idénticas en los dos lados (el dígito de verificación del NIT).
  # Por eso necesita `shared` compilado: los tipos salen de src/, pero el import
  # en tiempo de ejecución resuelve a dist/, que en un clon limpio no existe.
  evepayadmin:
    name: EvePay Admin
    runs-on: ubuntu-latest
    needs: [cambios, shared]
    if: ${{ !failure() && !cancelled() && needs.cambios.outputs.evepayadmin == 'true' }}
    env:
      # NEXT_PUBLIC_* se hornean en build time; placeholders válidos para CI.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @evetev/shared build

      - name: Lint
        run: pnpm --filter @evetev/evepay-admin lint

      - name: Typecheck
        run: pnpm --filter @evetev/evepay-admin typecheck

      - name: Test
        run: pnpm --filter @evetev/evepay-admin test

      - name: Build
        run: pnpm --filter @evetev/evepay-admin build

  # ── Eve Studio: el arnés de escritura ──────────────────────────────────────
  # La única app en Python del repo, y la única que no se despliega: corre en el
  # portátil de quien la usa. Lo que se prueba aquí no es la interfaz, es el
  # arnés — `validar_ruta`, `_resolver` y `_guardar`—, que es lo que separa «un
  # agente que edita tres landings» de «un agente con permiso de escritura sobre
  # tu disco». Vive en código y no en el prompt porque a un `if` no se le
  # convence; esta prueba existe para que ese `if` no se pueda borrar en
  # silencio.
  evestudio:
    name: Eve Studio
    runs-on: ubuntu-latest
    needs: cambios
    if: ${{ needs.cambios.outputs.evestudio == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/eve-studio/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: apps/eve-studio
        run: pip install -r requirements-dev.txt

      # Se llama a pytest directamente y NO por `pnpm test`: ese script sale 0
      # cuando no encuentra pytest, para no romper `pnpm -r test` a quien solo
      # toca el lado Node. Aquí eso sería justo el fallo que esto viene a
      # evitar —CI en verde porque la prueba no llegó a correr—.
      - name: Pruebas del arnés
        working-directory: apps/eve-studio
        run: pytest -q tests

  # ── El único check que debe exigir la protección de rama ───────────────────
  # Corre siempre, y solo se pone en rojo si algo falló o se canceló. Un job
  # omitido no es un fallo: es que ese área no se tocó.
  resultado:
    name: CI completo
    runs-on: ubuntu-latest
    if: always()
    needs: [cambios, formato, landings, shared, api, eveconecta, eveledger, evepayadmin, evestudio]
    steps:
      - name: Comprobar los resultados
        run: |
          resultados="${{ join(needs.*.result, ' ') }}"
          echo "Resultados: $resultados"
          for r in $resultados; do
            case "$r" in
              failure|cancelled)
                echo "::error::Hay jobs en rojo o cancelados."
                exit 1
                ;;
            esac
          done
          echo "Todo en verde (o correctamente omitido)."
