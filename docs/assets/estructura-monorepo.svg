<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sub { font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .core { fill: #dbeafe; stroke: #2563eb; }
    .today { fill: #dcfce7; stroke: #16a34a; }
    .shared { fill: #ede9fe; stroke: #7c3aed; }
    .future { fill: #f8fafc; stroke: #94a3b8; stroke-dasharray: 5 4; }
    .box { rx: 10; }
    .cap { font-size: 11px; fill: #475569; }
  </style>

  <text x="24" y="38" class="title">Monorepo evetev — arranque mínimo (§8)</text>

  <!-- apps -->
  <text x="24" y="72" class="lbl" font-weight="700">apps/</text>

  <!-- api (core) -->
  <rect x="24" y="84" width="340" height="118" class="box core"/>
  <text x="44" y="110" class="lbl mono" font-weight="700">api/ — EvePay (núcleo)</text>
  <text x="44" y="130" class="sub">La plataforma de pagos. Lo que vendemos.</text>
  <text x="44" y="150" class="sub">No sabe qué es una "cuota" ni un "residente".</text>
  <text x="44" y="176" class="sub mono">src/modules/ pagos · ledger</text>
  <text x="44" y="192" class="cap">(+ conciliacion · merchants · webhooks… cuando se pidan)</text>

  <!-- eveconecta (today) -->
  <rect x="384" y="84" width="352" height="118" class="box today"/>
  <text x="404" y="110" class="lbl mono" font-weight="700">eveconecta/ — EveConecta — 1.ª vertical</text>
  <text x="404" y="130" class="sub">Front + su propio backend de dominio.</text>
  <text x="404" y="150" class="sub">Consume EvePay por HTTP (dogfooding).</text>
  <text x="404" y="176" class="sub mono">app/ · app/api/ · server/</text>
  <text x="404" y="192" class="cap">cuotas · unidades · residentes viven aquí</text>

  <!-- packages -->
  <text x="24" y="248" class="lbl" font-weight="700">packages/</text>

  <rect x="24" y="260" width="222" height="86" class="box shared"/>
  <text x="44" y="286" class="lbl mono" font-weight="700">shared/</text>
  <text x="44" y="308" class="sub">Tipos, DTOs y esquemas Zod.</text>
  <text x="44" y="326" class="sub">El contrato de EvePay, una vez.</text>

  <rect x="258" y="260" width="222" height="86" class="box shared"/>
  <text x="278" y="286" class="lbl mono" font-weight="700">config/</text>
  <text x="278" y="308" class="sub">ESLint · Prettier · tsconfig base.</text>
  <text x="278" y="326" class="sub">Una sola config de calidad.</text>

  <rect x="492" y="260" width="244" height="86" class="box shared"/>
  <text x="512" y="286" class="lbl mono" font-weight="700">brand/</text>
  <text x="512" y="308" class="sub">Logos, isotipos, favicon, tokens.</text>
  <text x="512" y="326" class="sub">Fuente de verdad de la marca.</text>

  <!-- future -->
  <text x="24" y="392" class="lbl" font-weight="700">Se agrega cuando el dolor aparezca (no antes):</text>
  <rect x="24" y="404" width="170" height="40" class="box future"/>
  <text x="40" y="429" class="sub mono">turborepo</text>
  <rect x="206" y="404" width="170" height="40" class="box future"/>
  <text x="222" y="429" class="sub mono">packages/ui</text>
  <rect x="388" y="404" width="180" height="40" class="box future"/>
  <text x="404" y="429" class="sub mono">packages/evepay-sdk</text>
  <rect x="580" y="404" width="156" height="40" class="box future"/>
  <text x="596" y="429" class="sub mono">website</text>

  <!-- legend -->
  <text x="24" y="484" class="cap">
    <tspan fill="#2563eb">■</tspan> núcleo
    <tspan fill="#16a34a">■</tspan> existe hoy
    <tspan fill="#7c3aed">■</tspan> compartido
    <tspan fill="#94a3b8">▦</tspan> a futuro
  </text>
  <text x="24" y="506" class="cap">La vertical habla con EvePay solo por HTTP. El núcleo nunca conoce el dominio de la vertical.</text>
</svg>
